<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OceanSphere | Ocean Forecast Reliability & Decision Support System</title>
    <meta name="description" content="Scientific research platform for ocean forecast reliability analysis, anomaly detection, and INCOIS decision support." />
    
    <!-- Prevent theme flash script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('oceansphere_theme');
          var isDark = saved === 'dark' || (
            (!saved || saved === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          );
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CesiumJS 3D Engine CDN & Base URL -->
    <script>
      window.CESIUM_BASE_URL = 'https://cesium.com/downloads/cesiumjs/releases/1.119/';
    </script>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.119/Widgets/widgets.css">
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Cesium.js"></script>
  </head>
  <body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 antialiased font-sans overflow-x-hidden selection:bg-ocean-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
